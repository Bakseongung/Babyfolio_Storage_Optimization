apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: php-source
  namespace: demo-app
data:
  index.php: |
    <?php
    header('Content-Type: text/html; charset=UTF-8');
    echo "<h1>Kong Ingress Test</h1>";
    echo "<p>Nginx + PHP-FPM multi-container Pod</p>";
    echo "<p>PHP version: " . phpversion() . "</p>";
    echo "<p>Pod hostname: " . gethostname() . "</p>";
    ?>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: demo-app
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-php
  namespace: demo-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-php

  template:
    metadata:
      labels:
        app: nginx-php

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

            - name: php-source
              mountPath: /var/www/html

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

        - name: php-fpm
          image: php:8.3-fpm-alpine

          ports:
            - name: php-fpm
              containerPort: 9000

          volumeMounts:
            - name: php-source
              mountPath: /var/www/html

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

        - name: php-source
          configMap:
            name: php-source
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-php
  namespace: demo-app
spec:
  type: ClusterIP

  selector:
    app: nginx-php

  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-php
  namespace: demo-app
  annotations:
    # ArgoCD UI 상단에 Grafana 이동 버튼 생성
    link.argocd.argoproj.io/external-link: "http://$grafana_ip"
spec:
  ingressClassName: kong

  rules:
    - host: rakko.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-php
                port:
                  number: 80

    - host: www.rakko.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-php
                port:
                  number: 80
