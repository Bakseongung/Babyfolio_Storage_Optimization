name: Sync to GitLab

on:
  push:
    branches: [ "main", "master" ]

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        run: |
          git push --force https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/Bakseongung/apple.git HEAD:refs/heads/main
