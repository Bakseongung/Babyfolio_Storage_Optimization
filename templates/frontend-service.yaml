apiVersion: v1
kind: Service
metadata:
  name: {{ include "babyfolio-storage-optimization.fullname" . }}-frontend
  labels:
    {{- include "babyfolio-storage-optimization.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "babyfolio-storage-optimization.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
