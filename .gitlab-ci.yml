# 1. GitLab 공식 Managed SAST & Secret Detection 연동
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - test

# 2. IP 주소 하드코딩 차단 스크립트
check_hardcoded_ip:
  stage: test
  image: alpine/git:latest # 👈 [핵심!] Git이 사전 설치된 경량 Alpine 이미지 지정
  script:
    - echo "🔍 소스코드 내 하드코딩된 IP 주소 검사 중..."
    
    # 사설 IP 대역 (172.16.x.x, 10.x.x.x, 192.168.x.x) 정규식 탐지
    - |
      IP_FOUND=$(git grep -E -n '(172\.(1[6-9]|2[0-9]|3[0-1])|10\.[0-9]{1,3}|192\.168\.)\.[0-9]{1,3}\.[0-9]{1,3}' -- ':!*.gitlab-ci.yml' ':!*.env*' ':!README.md' ':!*.gitignore' || true)
      
      if [ -n "$IP_FOUND" ]; then
        echo "❌ [보안 위반] 소스코드 내에 하드코딩된 IP 주소가 감지되었습니다!"
        echo "--------------------------------------------------------"
        echo "$IP_FOUND"
        echo "--------------------------------------------------------"
        echo "💡 IP 주소를 코드에 직접 적지 마시고, ~/.env 환경변수를 불러와 사용해 주세요."
        exit 1
      else
        echo "✅ 하드코딩된 IP 주소가 없습니다. (환경변수 사용 준수 확인 완료)"
      fi
  only:
    - main
    - master
